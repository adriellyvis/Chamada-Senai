<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Professor - EyeCount</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/professor-base.css" />
  <link rel="stylesheet" href="./css/dashboard-professor.css" />
  <link rel="stylesheet" href="./css/turmas-professor.css" />
  <link rel="stylesheet" href="./css/alunos-professor.css" />
  <link rel="stylesheet" href="./css/ocorrencias-professor.css" />
  <link rel="stylesheet" href="./css/chamada-professor.css" />
  <link rel="stylesheet" href="./css/historico-professor.css" />
  <link rel="stylesheet" href="./css/detalhes-aula.css" />
</head>
<body>
  <div class="layout-shell">
    <aside class="sidebar">
      <section class="sidebar-topo">
        <h2>BEM-VINDO DE VOLTA!</h2>
        <div class="profile-wrap">
          <div class="avatar"></div>
          <div class="profile-info">
            <strong id="nomeUsuario" class="name"></strong>
            <span class="role">Professor(a)</span>
          </div>
        </div>
      </section>

      <nav class="menu" aria-label="Menu principal">
        <a class="nav-item active" href="#" data-page="dashboard">
          <i data-lucide="house" class="nav-icon"></i>
          <span>Home</span>
        </a>

        <a class="nav-item" href="#" data-page="turmas">
          <i data-lucide="school" class="nav-icon"></i>
          <span>Turmas</span>
        </a>

        <a class="nav-item" href="#" data-page="alunos">
          <i data-lucide="users-round" class="nav-icon"></i>
          <span>Alunos</span>
        </a>

        <a class="nav-item" href="#" data-page="ocorrencias">
          <i data-lucide="book-open" class="nav-icon"></i>
          <span>Ocorrências</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="footer-circle-btn theme-toggle" id="toggleTemaBtn" type="button" title="Alternar tema">
          <span class="theme-knob">
            <i data-lucide="sun" class="theme-icon theme-icon-light"></i>
            <i data-lucide="moon" class="theme-icon theme-icon-dark"></i>
          </span>
        </button>

        <div class="footer-menu-wrap">
          <button class="footer-circle-btn settings-btn" id="abrirMenuConfig" type="button" title="Menu">
            <i data-lucide="settings-2"></i>
          </button>

          <div class="footer-dropdown" id="menuConfigDropdown">
            <button type="button" data-acao="perfil">
              <i data-lucide="user-round"></i>
              <span>Perfil</span>
            </button>

            <button type="button" data-acao="configuracoes">
              <i data-lucide="settings"></i>
              <span>Configurações</span>
            </button>

            <button type="button" data-acao="tema">
              <i data-lucide="sun-moon"></i>
              <span>Alternar tema</span>
            </button>

            <button type="button" data-acao="logout" class="danger">
              <i data-lucide="log-out"></i>
              <span>Sair</span>
            </button>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div id="conteudoPrincipal"></div>
    </main>
  </div>

  <script type="module" src="./js/main-professor.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</body>
</html>
