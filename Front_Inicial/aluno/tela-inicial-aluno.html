<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Portal do Aluno - EyeCount</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/sidebar.css">
  <link rel="stylesheet" href="./css/cards.css">
  <link rel="stylesheet" href="./css/dashboard.css">
  <link rel="stylesheet" href="./css/chamada.css">
  <link rel="stylesheet" href="./css/frequencia.css">
  <link rel="stylesheet" href="./css/avisos.css">
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__top">
        <h2 class="sidebar__title">BEM-VINDO DE VOLTA!</h2>

        <div class="sidebar__profile">
          <div class="sidebar__avatar" id="avatarAluno">A</div>

          <div class="sidebar__profile-text">
            <strong id="nomeAluno">Aluno</strong>
            <span>Portal do Aluno</span>
          </div>
        </div>

        <nav class="sidebar__nav">
          <button class="sidebar__item is-active" data-page="dashboard">
            <span class="sidebar__icon">⌂</span>
            <span>Home</span>
          </button>

          <button class="sidebar__item" data-page="frequencia">
            <span class="sidebar__icon">●</span>
            <span>Frequências</span>
          </button>

          <button class="sidebar__item" data-page="chamada">
            <span class="sidebar__icon">◉</span>
            <span>Chamada</span>
          </button>

          <button class="sidebar__item" data-page="avisos">
            <span class="sidebar__icon">◒</span>
            <span>Avisos</span>
          </button>
        </nav>
      </div>

      <div class="sidebar__footer">
        <div class="sidebar__menu-wrapper">
          <button class="sidebar__round-btn" id="btnMenuPerfil" title="Abrir menu">
            ⚙
          </button>

          <div class="sidebar__menu-dropdown" id="menuPerfilDropdown">
            <button class="sidebar__menu-item" id="btnPerfil">Perfil</button>
            <button class="sidebar__menu-item" id="btnConfiguracoes">Configurações</button>
            <button class="sidebar__menu-item sidebar__menu-item--danger" id="btnLogout">
              Sair
            </button>
          </div>
        </div>

        <button class="sidebar__theme-switch" id="btnTemaSwitch" title="Alternar tema">
          <span></span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar__title">
          <h1 id="tituloPagina">MEU DESEMPENHO</h1>
          <p id="subtituloPagina">Aqui está o seu processo avaliativo acadêmico!</p>
        </div>

        <div class="topbar__actions">
          <button class="notification-btn" title="Notificações">
            🔔
          </button>

          <div class="search-box">
            <input type="text" placeholder="Procurar disciplina..." />
            <span>⌕</span>
          </div>
        </div>
      </header>

      <section class="page page-dashboard is-active" id="page-dashboard"></section>

      <section class="page page-frequencia" id="page-frequencia"></section>

      <section class="page page-chamada" id="page-chamada"></section>

      <section class="page page-avisos" id="page-avisos"></section>
    </main>
  </div>

  <script type="module" src="./js/main-aluno.js"></script>
</body>
</html>
