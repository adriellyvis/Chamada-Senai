<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Portal do Aluno - EyeCount</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="../core/icons.css">
  <link rel="stylesheet" href="../core/configuracoes.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/sidebar.css">
  <link rel="stylesheet" href="./css/cards.css">
  <link rel="stylesheet" href="./css/dashboard.css">
  <link rel="stylesheet" href="./css/chamada.css">
  <link rel="stylesheet" href="./css/frequencia.css">
  <link rel="stylesheet" href="./css/notas.css">
  <link rel="stylesheet" href="./css/avisos.css">
  <link rel="stylesheet" href="./css/agenda.css">
  <link rel="stylesheet" href="./css/topbar-interacoes.css">
  <link rel="stylesheet" href="../biometria/perfil-biometrico.css">
  <link rel="stylesheet" href="../core/mobile-shell.css">
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__top">
        <h2 class="sidebar__title">BEM-VINDO DE VOLTA!</h2>

        <button class="sidebar__profile" id="btnAbrirPerfilAluno" type="button" title="Abrir perfil do aluno">
          <div class="sidebar__avatar" id="avatarAluno">A</div>

          <div class="sidebar__profile-text">
            <strong id="nomeAluno">Aluno</strong>
            <span>Portal do Aluno</span>
          </div>
        </button>

        <nav class="sidebar__nav">
          <button class="sidebar__item is-active" data-page="dashboard">
            <span class="sidebar__icon material-symbols-rounded" aria-hidden="true">home</span>
            <span>Home</span>
          </button>

          <button class="sidebar__item" data-page="agenda">
            <span class="sidebar__icon material-symbols-rounded" aria-hidden="true">calendar_month</span>
            <span>Agenda</span>
          </button>

          <button class="sidebar__item" data-page="frequencia">
            <span class="sidebar__icon material-symbols-rounded" aria-hidden="true">monitoring</span>
            <span>Frequências</span>
          </button>

          <button class="sidebar__item" data-page="notas">
            <span class="sidebar__icon material-symbols-rounded" aria-hidden="true">school</span>
            <span>Notas</span>
          </button>

          <button class="sidebar__item" data-page="chamada">
            <span class="sidebar__icon material-symbols-rounded" aria-hidden="true">face</span>
            <span>Chamada</span>
          </button>

          <button class="sidebar__item" data-page="avisos">
            <span class="sidebar__icon material-symbols-rounded" aria-hidden="true">campaign</span>
            <span>Avisos</span>
          </button>
        </nav>
      </div>

      <div class="sidebar__footer">
        <div class="sidebar__menu-wrapper">
          <button class="sidebar__round-btn" id="btnMenuPerfil" title="Abrir menu" aria-label="Abrir menu de perfil">
            <span class="material-symbols-rounded" aria-hidden="true">tune</span>
          </button>

          <div class="sidebar__menu-dropdown" id="menuPerfilDropdown">
            <button class="sidebar__menu-item" id="btnPerfil">
              <span class="material-symbols-rounded" aria-hidden="true">person</span>
              Perfil
            </button>
            <button class="sidebar__menu-item" id="btnConfiguracoes">
              <span class="material-symbols-rounded" aria-hidden="true">settings</span>
              Configurações
            </button>
            <button class="sidebar__menu-item sidebar__menu-item--danger" id="btnLogout">
              <span class="material-symbols-rounded" aria-hidden="true">logout</span>
              Sair
            </button>
          </div>
        </div>

        <button class="sidebar__theme-switch" id="btnTemaSwitch" title="Alternar tema" aria-label="Alternar tema">
          <span class="material-symbols-rounded theme-icon-light" aria-hidden="true">light_mode</span>
          <span class="material-symbols-rounded theme-icon-dark" aria-hidden="true">dark_mode</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar__title">
          <h1 id="tituloPagina">MEU DESEMPENHO</h1>
          <p id="subtituloPagina">Aqui está o seu processo avaliativo acadêmico!</p>
        </div>

        <div class="topbar__actions">
          <div class="notificacoes-aluno-wrapper">
            <button
              class="notification-btn"
              id="btnNotificacoesAluno"
              type="button"
              title="Notificações"
              aria-label="Abrir notificações"
              aria-expanded="false"
            >
              <span class="material-symbols-rounded" aria-hidden="true">notifications</span>
              <span class="notificacoes-aluno-badge" id="badgeNotificacoesAluno" hidden>0</span>
            </button>

            <div class="notificacoes-aluno-painel" id="painelNotificacoesAluno" hidden></div>
          </div>

          <div class="search-box busca-aluno-wrapper">
            <input
              id="buscaAlunoInput"
              type="search"
              placeholder="Pesquisar disciplinas e avisos..."
              autocomplete="off"
              aria-label="Pesquisar disciplinas e avisos"
              aria-expanded="false"
              aria-controls="buscaAlunoResultados"
            />
            <span class="material-symbols-rounded" aria-hidden="true">search</span>
            <div class="busca-aluno-resultados" id="buscaAlunoResultados" hidden></div>
          </div>
        </div>
      </header>

      <section class="page page-dashboard is-active" id="page-dashboard"></section>

      <section class="page page-perfil" id="page-perfil"></section>

      <section class="page page-frequencia" id="page-frequencia"></section>

      <section class="page page-notas" id="page-notas"></section>

      <section class="page page-chamada" id="page-chamada"></section>

      <section class="page page-avisos" id="page-avisos"></section>

      <section class="page page-agenda" id="page-agenda"></section>

      <section class="page page-configuracoes" id="page-configuracoes"></section>
    </main>
  </div>

  <script type="module" src="./js/main-aluno.js"></script>
  <script type="module" src="../core/mobile-shell.js"></script>
</body>
</html>
