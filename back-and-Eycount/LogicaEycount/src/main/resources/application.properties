spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/prezence}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

jwt.secret=${JWT_SECRET:}

# =====================================================
# BIOMETRIA
# =====================================================

# Fallback apenas para desenvolvimento local.
# Em deploy, configure BIOMETRIA_SERVICE_KEY no ambiente.
biometria.service-key=${BIOMETRIA_SERVICE_KEY:prezence-dev-2026}
biometria.python-url=${BIOMETRIA_PYTHON_URL:http://localhost:5000}
biometria.validar-path=/biometria/validar

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
