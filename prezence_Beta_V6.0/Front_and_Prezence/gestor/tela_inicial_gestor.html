<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor - PreZence</title>
  <link rel="stylesheet" href="css/tela-inicial-gestor.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/notificacoes-gestor.css">
  <link rel="stylesheet" href="css/aluno-gestor.css">
  <link rel="stylesheet" href="css/turmas.css">
  <link rel="stylesheet" href="css/ocorrencia-gestor.css">
  <link rel="stylesheet" href="css/disciplinas.css">
  <link rel="stylesheet" href="css/perfil-gestor.css">
  <link rel="stylesheet" href="../biometria/perfil-biometrico.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../core/icons.css">
  <link rel="stylesheet" href="../core/configuracoes.css">
  <link rel="stylesheet" href="../core/ui-feedback.css">
  <link rel="stylesheet" href="../core/mobile-shell.css">
  <link rel="stylesheet" href="../core/dark-theme-polish.css">
</head>
<body class="gestor-mobile">

<div class="container">
  <aside class="sidebar">
    <h2>BEM-VINDO DE VOLTA!</h2>
    <button class="perfil" id="btnAbrirPerfilGestor" type="button" title="Abrir perfil do gestor">
      <div class="avatar"></div>

      <div>
        <strong id="nomeUsuario"></strong>
        <p>Gestor(a) - Setor de Apoio</p>
      </div>
    </button>

    <nav>
      <a id="menuDashboard" class="ativo"><span class="material-symbols-rounded gestor-nav-icon" aria-hidden="true">home</span><span>Home</span></a>
      <a id="menuTurmas"><span class="material-symbols-rounded gestor-nav-icon" aria-hidden="true">school</span><span>Turmas</span></a>
      <a id="menuAlunos"><span class="material-symbols-rounded gestor-nav-icon" aria-hidden="true">group</span><span>Alunos</span></a>
      <a id="menuDisciplinas"><span class="material-symbols-rounded gestor-nav-icon" aria-hidden="true">menu_book</span><span>Disciplinas</span></a>
      <a id="menuOcorrencias"><span class="material-symbols-rounded gestor-nav-icon" aria-hidden="true">assignment_late</span><span>Ocorrências</span></a>
    </nav>

    <div class="sidebar-footer">
      <div class="config-wrapper">
        <button id="btnConfig" class="sidebar-icon-btn" type="button" aria-label="Abrir menu de configurações">
          <span class="material-symbols-rounded" aria-hidden="true">tune</span>
        </button>

        <div id="menuConfig" class="config-menu">
          <button type="button" id="btnPerfil"><span class="material-symbols-rounded" aria-hidden="true">person</span>Perfil</button>
          <button type="button" id="btnConfiguracoes"><span class="material-symbols-rounded" aria-hidden="true">settings</span>Configurações</button>
          <button type="button" id="btnLogout"><span class="material-symbols-rounded" aria-hidden="true">logout</span>Logout</button>
        </div>
      </div>

      <button id="btnTema" class="sidebar-icon-btn tema-btn" type="button" aria-label="Alternar tema">
        <span class="material-symbols-rounded tema-icon-claro" aria-hidden="true">light_mode</span>
        <span class="material-symbols-rounded tema-icon-escuro" aria-hidden="true">dark_mode</span>
      </button>
    </div>

  </aside>

  <main class="main">

    <header class="topo">

      <div>
        <h1>GERENCIAMENTO INSTITUCIONAL</h1>
        <p>Aqui está o resumo das suas turmas.</p>
      </div>

      <div class="acoes-topo">

        <button class="notificacao" aria-label="Abrir notificações"><span class="material-symbols-rounded" aria-hidden="true">notifications</span></button>

        <div class="search search-global">
          <input
            type="text"
            id="buscaGlobalGestor"
            placeholder="Buscar aluno, professor, turma..."
          >
          <span class="material-symbols-rounded" aria-hidden="true">search</span>

          <div id="resultadoBuscaGlobal" class="resultado-busca-global"></div>
        </div>

      </div>

    </header>

    <div id="conteudoPrincipal"></div>
  </main>
</div>

<script type="module" src="js/tela_inicial_gestor.js"></script>
  <script type="module" src="../core/mobile-shell.js"></script>
</body>
</html>
